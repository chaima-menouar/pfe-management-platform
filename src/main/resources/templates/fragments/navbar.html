<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="navbar(activePage)">
<style>
:root{--sb-w:260px;}
*{box-sizing:border-box;margin:0;padding:0;}
.sidebar{
    width:var(--sb-w);min-height:100vh;position:fixed;top:0;left:0;z-index:1000;
    display:flex;flex-direction:column;
    background:linear-gradient(175deg,#1158b8 0%,#0a3272 55%,#072050 100%);
    border-right:1px solid rgba(255,255,255,0.10);
}
.sb-brand{
    display:flex;align-items:center;gap:13px;padding:16px 16px 14px;
    border-bottom:1px solid rgba(255,255,255,0.10);
    text-decoration:none;
}
.sb-logo{
    width:100px;height:100px;object-fit:contain;
    flex-shrink:0;
    filter:drop-shadow(0 2px 10px rgba(0,0,0,0.25));
}
.sb-title{font-size:1.08rem;font-weight:800;color:white;letter-spacing:-0.2px;line-height:1.25;}
.sb-sub{font-size:0.75rem;color:rgba(255,255,255,0.62);margin-top:3px;font-weight:500;}

.sb-nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1;}
.sb-link{
    display:flex;align-items:center;gap:11px;text-decoration:none;
    color:rgba(255,255,255,0.85);padding:10px 13px;border-radius:10px;
    font-weight:600;font-size:13.5px;transition:background .18s,transform .18s;
    border:1px solid transparent;
}
.sb-link:hover{background:rgba(255,255,255,0.09);transform:translateX(3px);}
.sb-link.active{background:rgba(255,255,255,0.16);border-color:rgba(255,255,255,0.13);color:white;}
.sb-link svg{
    width:17px;height:17px;flex-shrink:0;
    fill:none;stroke:currentColor;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round;opacity:0.88;
}
.sb-bottom{padding:10px 10px 0;}
.sb-logout{
    display:flex;align-items:center;gap:11px;
    width:100%;padding:10px 13px;border-radius:10px;
    background:rgba(220,38,38,0.18);border:1px solid rgba(220,38,38,0.30);
    color:#fca5a5;font-weight:700;font-size:13.5px;
    cursor:pointer;text-decoration:none;
    transition:background .18s,transform .18s;
}
.sb-logout:hover{background:rgba(220,38,38,0.30);transform:translateX(3px);}
.sb-logout svg{width:17px;height:17px;flex-shrink:0;fill:none;stroke:#fca5a5;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.sb-footer{padding:10px 18px 14px;font-size:11px;color:rgba(255,255,255,0.35);text-align:center;margin-top:8px;}
.page-content{margin-left:var(--sb-w);width:calc(100% - var(--sb-w));min-height:100vh;}
@media(max-width:992px){
    .sidebar{position:relative;width:100%;min-height:auto;}
    .page-content{margin-left:0;width:100%;}
}
</style>

<aside class="sidebar">
    <a th:href="@{/}" class="sb-brand">
        <img th:src="@{/images/logo.png}" alt="ENSAH" class="sb-logo">
        <div>
            <div class="sb-title">Gestion PFE</div>
            <div class="sb-sub">ENSAH &middot; Al Hoceima</div>
        </div>
    </a>

    <nav class="sb-nav">

        <a th:href="@{/}" class="sb-link" th:classappend="${activePage=='dashboard'}?' active':''">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            <span>Dashboard</span>
        </a>

        <a th:href="@{/students}" class="sb-link" th:classappend="${activePage=='students'}?' active':''">
            <svg viewBox="0 0 24 24"><path d="M12 3L2 9l10 6 10-6-10-6z"/><path d="M6 11.5v4.5c0 0 2 2 6 2s6-2 6-2v-4.5"/></svg>
            <span>&#201;tudiants</span>
        </a>

        <a th:href="@{/teachers}" class="sb-link" th:classappend="${activePage=='teachers'}?' active':''">
            <svg viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.5"/><path d="M2 20c0-3.5 3-6 8-6s8 2.5 8 6"/><line x1="18" y1="5" x2="18" y2="11"/><line x1="15" y1="8" x2="21" y2="8"/></svg>
            <span>Encadrants</span>
        </a>

        <a th:href="@{/rooms}" class="sb-link" th:classappend="${activePage=='rooms'}?' active':''">
            <svg viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="12" y1="11" x2="12" y2="15"/><line x1="10" y1="13" x2="14" y2="13"/></svg>
            <span>Salles</span>
        </a>

        <a th:href="@{/defenses}" class="sb-link" th:classappend="${activePage=='defenses'}?' active':''">
            <svg viewBox="0 0 24 24"><path d="M12 21s8-4 8-9.5V5.5l-8-3-8 3V11.5c0 5.5 8 9.5 8 9.5z"/></svg>
            <span>Soutenances</span>
        </a>

        <a th:href="@{/import}" class="sb-link" th:classappend="${activePage=='import'}?' active':''">
            <svg viewBox="0 0 24 24"><polyline points="8 17 12 21 16 17"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.29"/></svg>
            <span>Import / Export</span>
        </a>

        <a th:href="@{/parametrage}" class="sb-link" th:classappend="${activePage=='parametrage'}?' active':''">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span>Param&#232;tres</span>
        </a>
        
    </nav>

    <div class="sb-bottom">
        <form th:action="@{/logout}" method="post">
        <button type="submit" class="sb-logout">
            <svg viewBox="0 0 24 24">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            <span>D&#233;connexion</span>
        </button>
        </form>
    </div>
    <div class="sb-footer">&#169; 2026 ENSAH &middot; Gestion PFE</div>
</aside>
</div>
</body>
</html>
