<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ajouter étudiant</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}
        body{
            font-family:Arial,sans-serif;
            color:#0f172a;
            background:
                radial-gradient(circle at top left,rgba(59,130,246,.08),transparent 26%),
                linear-gradient(180deg,#eef4ff 0%,#f8fbff 24%,#f8fafc 100%);
            min-height:100vh;
        }

        .main-content{
            margin-left:280px;
            width:calc(100% - 280px);
            min-height:100vh;
            padding:28px 26px 40px;
        }

        .hero{
            position:relative;overflow:hidden;border-radius:24px;
            padding:30px 34px;color:white;margin-bottom:22px;
            background:
                linear-gradient(135deg,rgba(29,78,216,.96),rgba(30,64,175,.92) 48%,rgba(15,23,42,.96)),
                url('/images/ensah.png') no-repeat right 28px center / 170px auto;
            box-shadow:0 20px 44px rgba(15,23,42,.18);
        }
        .hero h1{margin:0 0 8px;font-size:clamp(1.6rem,3vw,2.2rem);}
        .hero p{margin:0;color:rgba(255,255,255,.88);line-height:1.7;max-width:700px;font-size:15px;}

        .form-card{
            background:rgba(255,255,255,.92);
            border:1px solid rgba(255,255,255,.80);
            border-radius:22px;
            padding:24px;
            box-shadow:0 16px 36px rgba(15,23,42,.08);
        }

        .info-box{
            background:#eff6ff;
            color:#1e3a8a;
            border:1px solid #bfdbfe;
            padding:14px;
            border-radius:12px;
            margin-bottom:18px;
            line-height:1.7;
        }

        .grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:16px;
        }

        .field{
            display:flex;
            flex-direction:column;
            gap:8px;
        }

        .field.full{
            grid-column:1 / -1;
        }

        label{
            font-weight:700;
            color:#1e293b;
        }

        input, select{
            padding:12px 14px;
            border:1px solid #cbd5e1;
            border-radius:12px;
            background:#f8fafc;
            font-size:14px;
        }

        .field-error{
            color:#dc2626;
            font-size:13px;
        }

        .alert-error{
            background:#fee2e2;
            color:#991b1b;
            border:1px solid #fecaca;
            padding:12px 14px;
            border-radius:12px;
            margin-bottom:14px;
            font-weight:700;
        }

        .actions{
            margin-top:22px;
            display:flex;
            gap:12px;
            flex-wrap:wrap;
        }

        .btn{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            padding:12px 18px;
            border-radius:12px;
            text-decoration:none;
            color:white;
            border:none;
            cursor:pointer;
            font-weight:700;
            font-size:14px;
            background:linear-gradient(135deg,#3b82f6,#2563eb);
            box-shadow:0 10px 22px rgba(37,99,235,.22);
        }

        .btn-secondary{
            background:linear-gradient(135deg,#64748b,#475569);
            box-shadow:0 10px 22px rgba(71,85,105,.20);
        }

        @media(max-width:992px){
            .main-content{margin-left:0;width:100%;padding:18px 14px 28px;}
        }
        @media(max-width:700px){
            .grid{grid-template-columns:1fr;}
            .actions .btn{width:100%;}
        }
    </style>
</head>
<body>

<div th:replace="fragments/navbar :: navbar('students')"></div>

<div class="main-content">

    <div class="hero">
        <h1>Ajouter un étudiant</h1>
        <p>Ajoutez un étudiant du département Informatique avec une seule filière autorisée et un encadrant si nécessaire.</p>
    </div>

    <div class="form-card">
        <div class="info-box">
            <strong>Département fixe :</strong> Informatique<br>
            <strong>Filières autorisées :</strong> GI, ID, TDIA
        </div>

        <div th:if="${error}" class="alert-error" th:text="${error}"></div>

        <form th:action="@{/students/save}" th:object="${student}" method="post">

            <input type="hidden" th:field="*{departement}" value="Informatique"/>

            <div class="grid">

                <div class="field">
                    <label>CNE</label>
                    <input type="text"
                           th:field="*{cne}"
                           required
                           pattern="^[A-Za-z][A-Za-z0-9]*$"
                           title="CNE doit commencer par une lettre puis contenir lettres/chiffres" />
                    <div th:if="${#fields.hasErrors('cne')}" th:errors="*{cne}" class="field-error"></div>
                </div>

                <div class="field">
                    <label>Email</label>
                    <input type="email"
                           th:field="*{email}"
                           required
                           pattern="^[A-Za-z0-9._%+-]+@etu\\.uae\\.ac\\.ma$"
                           title="Email doit être xxx@etu.uae.ac.ma" />
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></div>
                </div>

                <div class="field">
                    <label>Nom</label>
                    <input type="text"
                           th:field="*{nom}"
                           required
                           pattern="^[A-Za-zÀ-ÿ\\- ]+$"
                           title="Nom: lettres uniquement" />
                    <div th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}" class="field-error"></div>
                </div>

                <div class="field">
                    <label>Prénom</label>
                    <input type="text"
                           th:field="*{prenom}"
                           required
                           pattern="^[A-Za-zÀ-ÿ\\- ]+$"
                           title="Prénom: lettres uniquement" />
                    <div th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}" class="field-error"></div>
                </div>

                <div class="field">
                    <label>Filière</label>
                    <select th:field="*{filiere}" required>
                        <option value="">-- Choisir filière --</option>
                        <option th:each="f : ${filieres}"
                                th:value="${f}"
                                th:text="${f}">
                        </option>
                    </select>
                    <div th:if="${#fields.hasErrors('filiere')}" th:errors="*{filiere}" class="field-error"></div>
                </div>

                <div class="field">
                    <label>Spécialité</label>
                    <select th:field="*{specialite}" required>
                        <option value="">-- Choisir spécialité --</option>
                        <th:block th:each="entry : ${specialitesByFiliere}">
                            <option th:each="s : ${entry.value}"
                                    th:value="${s}"
                                    th:text="${s}">
                            </option>
                        </th:block>
                    </select>
                    <div th:if="${#fields.hasErrors('specialite')}" th:errors="*{specialite}" class="field-error"></div>
                </div>

                <div class="field">
                    <label>Langue de soutenance</label>
                    <select th:field="*{langueSoutenance}" required>
                        <option value="">-- Choisir langue --</option>
                        <option value="FR">FR</option>
                        <option value="EN">EN</option>
                        <option value="AR">AR</option>
                    </select>
                    <div th:if="${#fields.hasErrors('langueSoutenance')}" th:errors="*{langueSoutenance}" class="field-error"></div>
                </div>

                <div class="field full">
                    <label>Thème PFE</label>
                    <input type="text" th:field="*{themePfe}" required />
                    <div th:if="${#fields.hasErrors('themePfe')}" th:errors="*{themePfe}" class="field-error"></div>
                </div>

                <div class="field">
                    <label>Encadrant</label>
                    <select th:field="*{encadrant}">
                        <option value="">-- Aucun --</option>
                        <option th:each="t : ${teachers}"
                                th:value="${t.id}"
                                th:text="${t.nom + ' ' + t.prenom + ' - ' + t.filiere}">
                        </option>
                    </select>
                </div>

                <div class="field">
                    <label>Affectation manuelle</label>
                    <select th:field="*{affectationManuelle}">
                        <option th:value="false">Non</option>
                        <option th:value="true">Oui</option>
                    </select>
                </div>

            </div>

            <div class="actions">
                <button type="submit" class="btn">Enregistrer</button>
                <a th:href="@{/students}" class="btn btn-secondary">Retour</a>
            </div>
        </form>
    </div>

</div>
</body>
</html>
