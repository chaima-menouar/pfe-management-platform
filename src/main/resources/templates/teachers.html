<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des enseignants</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}

        body{
            font-family:Arial,sans-serif;
            color:#0f172a;
            background:
                radial-gradient(circle at top left,rgba(59,130,246,.08),transparent 26%),
                linear-gradient(180deg,#eef4ff 0%,#f8fbff 24%,#f8fafc 100%);
            min-height:100vh;
        }

        /* ── FIX PRINCIPAL : contenu décalé à droite de la navbar ── */
        .main-content{
            margin-left:280px;
            width:calc(100% - 280px);
            min-height:100vh;
            padding:28px 26px 40px;
        }

        /* ── HERO ── */
        .hero{
            position:relative;overflow:hidden;border-radius:24px;
            padding:30px 34px;color:white;margin-bottom:22px;
            background:
                linear-gradient(135deg,rgba(29,78,216,.96),rgba(30,64,175,.92) 48%,rgba(15,23,42,.96)),
                url('/images/ensah.png') no-repeat right 28px center / 170px auto;
            box-shadow:0 20px 44px rgba(15,23,42,.18);
        }
        .hero h1{margin:0 0 8px;font-size:clamp(1.6rem,3vw,2.2rem);}
        .hero p{margin:0;color:rgba(255,255,255,.88);line-height:1.7;max-width:680px;font-size:15px;}

        /* ── ACTIONS BAR ── */
        .actions-bar{
            display:flex;justify-content:space-between;align-items:center;
            flex-wrap:wrap;gap:12px;margin-bottom:20px;
        }
        .actions-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

        .import-form{
            display:flex;gap:8px;align-items:center;flex-wrap:wrap;
            background:rgba(255,255,255,.80);border:1px solid rgba(255,255,255,.90);
            border-radius:14px;padding:8px 12px;
            box-shadow:0 6px 16px rgba(15,23,42,.06);
        }
        .import-form input[type="file"]{
            padding:8px;background:#f8fafc;
            border:1px solid #cbd5e1;border-radius:10px;font-size:13px;
        }

        /* ── BUTTONS ── */
        .btn{
            display:inline-flex;align-items:center;justify-content:center;gap:6px;
            text-decoration:none;border:none;cursor:pointer;
            padding:11px 18px;border-radius:13px;color:white;
            font-weight:700;font-size:13.5px;
            background:linear-gradient(135deg,#3b82f6,#2563eb);
            box-shadow:0 10px 22px rgba(37,99,235,.22);
            transition:transform .22s,box-shadow .22s,filter .22s;
        }
        .btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 16px 28px rgba(37,99,235,.28);filter:brightness(1.04);}
        .btn-secondary{background:linear-gradient(135deg,#64748b,#475569);box-shadow:0 10px 22px rgba(71,85,105,.20);}
        .btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 10px 22px rgba(220,38,38,.22);}

        /* ── ALERTS ── */
        .alert-success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0;padding:13px 16px;border-radius:12px;margin-bottom:14px;font-weight:700;}
        .alert-error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca;padding:13px 16px;border-radius:12px;margin-bottom:14px;font-weight:700;}

        /* ── TABLE CARD ── */
        .table-card{
            background:rgba(255,255,255,.92);
            border:1px solid rgba(255,255,255,.80);
            border-radius:22px;
            box-shadow:0 16px 36px rgba(15,23,42,.08);
            overflow:hidden;
        }
        .table-wrap{width:100%;overflow-x:auto;}

        table{width:100%;min-width:900px;border-collapse:collapse;}

        th,td{
            border-bottom:1px solid #e2e8f0;
            padding:13px 12px;text-align:left;
            vertical-align:middle;font-size:14px;
        }
        th{
            background:linear-gradient(135deg,#eaf2ff,#dbeafe);
            color:#0f172a;font-weight:800;
            position:sticky;top:0;
        }
        tbody tr{transition:background .15s;}
        tbody tr:hover{background:rgba(219,234,254,.25);}
        tbody tr:last-child td{border-bottom:none;}

        .badge-oui{
            display:inline-block;padding:3px 10px;border-radius:999px;
            background:#dcfce7;color:#166534;font-weight:700;font-size:12px;
        }
        .badge-non{
            display:inline-block;padding:3px 10px;border-radius:999px;
            background:#f1f5f9;color:#64748b;font-weight:700;font-size:12px;
        }

        .action-link{font:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:none;font-weight:700;color:#1d4ed8;transition:color .15s;}
        .action-link:hover{color:#2563eb;}
        .action-link.delete{color:#dc2626;}
        .action-link.delete:hover{color:#b91c1c;}
        .sep{color:#cbd5e1;margin:0 4px;}

        @media(max-width:992px){.main-content{margin-left:0;width:100%;padding:18px 14px 28px;}}
        @media(max-width:640px){.actions-bar{flex-direction:column;align-items:stretch;}}
    </style>
</head>
<body>

<div th:replace="fragments/navbar :: navbar('teachers')"></div>

<div class="main-content">

    <div class="hero">
        <h1>Liste des enseignants</h1>
        <p>Consultez, importez et gérez les enseignants encadrants, leurs spécialités, langues et capacités d'encadrement.</p>
    </div>

    <div class="actions-bar">
        <div></div>
        <div class="actions-right">
            <form class="import-form"
                  th:action="@{/import-export/import/teachers-excel}"
                  method="post" enctype="multipart/form-data">
                <input type="file" name="file" accept=".xlsx,.xls" required>
                <button type="submit" class="btn btn-secondary">Importer enseignants</button>
            </form>
            <form th:action="@{/teachers/delete-all}" method="post"
                  onsubmit="return confirm('Attention: toutes les soutenances seront supprimées et les encadrants seront retirés des étudiants. Voulez-vous supprimer tous les enseignants ?');">
                <button type="submit" class="btn btn-danger">Supprimer tous les enseignants</button>
            </form>
            <a class="btn" th:href="@{/teachers/new}">+ Ajouter un enseignant</a>
        </div>
    </div>

    <div th:if="${success}" class="alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <div class="table-card">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>PPR</th>
                    <th>Nom</th>
                    <th>Pr&#233;nom</th>
                    <th>Email</th>
                    <th>D&#233;partement</th>
                    <th>Sp&#233;cialit&#233;</th>
                    <th>Langue</th>
                    <th>Max Encadrement</th>
                    <th>Max Jury</th>
                    <th>Prof Langue</th>
                    <th>Actif</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="teacher : ${teachers}">
                    <td th:text="${teacher.id}"></td>
                    <td th:text="${teacher.ppr}"></td>
                    <td th:text="${teacher.nom}"></td>
                    <td th:text="${teacher.prenom}"></td>
                    <td th:text="${teacher.email}"></td>
                    <td th:text="${teacher.departement}"></td>
                    <td th:text="${teacher.specialite}"></td>
                    <td th:text="${teacher.langue}"></td>
                    <td th:text="${teacher.maxEncadrement}"></td>
                    <td th:text="${teacher.maxJury}"></td>
                    <td>
				    <span th:if="${teacher.estProfLangue != null && teacher.estProfLangue}" class="badge-oui">Oui</span>
				    <span th:if="${teacher.estProfLangue == null || !teacher.estProfLangue}" class="badge-non">Non</span>
					</td>
				    <td>
                        <span th:if="${teacher.actif != null && teacher.actif}" class="badge-oui">Oui</span>
                        <span th:if="${teacher.actif == null || !teacher.actif}" class="badge-non">Non</span>
                    </td>
                    <td>
                        <a class="action-link" th:href="@{/teachers/edit/{id}(id=${teacher.id})}">Modifier</a>
                        <span class="sep">|</span>
                        <form th:action="@{/teachers/delete/{id}(id=${teacher.id})}" method="post" style="display:inline"
                              onsubmit="return confirm('Voulez-vous vraiment supprimer cet enseignant ?');">
                            <button class="action-link delete" type="submit">Supprimer</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
