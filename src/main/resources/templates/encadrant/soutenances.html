<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Mes soutenances · Gestion PFE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--sb-w:260px;}
body{
    font-family:'Segoe UI',Arial,sans-serif;color:#16304f;
    background-color:#b8cfe8;
    background-image:linear-gradient(rgba(185,210,240,0.50),rgba(185,210,240,0.50)),url('/images/ensah.png');
    background-size:cover;background-position:center;background-attachment:fixed;background-repeat:no-repeat;
    min-height:100vh;display:flex;
}
.sidebar{
    width:var(--sb-w);min-height:100vh;position:fixed;top:0;left:0;z-index:1000;
    display:flex;flex-direction:column;
    background:linear-gradient(175deg,#1158b8 0%,#0a3272 55%,#072050 100%);
    border-right:1px solid rgba(255,255,255,0.10);
}
.sb-brand{display:flex;align-items:center;gap:13px;padding:16px 16px 14px;border-bottom:1px solid rgba(255,255,255,0.10);text-decoration:none;}
.sb-logo{width:54px;height:54px;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 2px 10px rgba(0,0,0,0.25));}
.sb-title{font-size:1.05rem;font-weight:800;color:white;line-height:1.25;}
.sb-sub{font-size:0.72rem;color:rgba(255,255,255,0.55);margin-top:2px;font-weight:500;}
.sb-nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px;flex:1;}
.sb-link{display:flex;align-items:center;gap:11px;text-decoration:none;color:rgba(255,255,255,0.80);padding:10px 13px;border-radius:10px;font-weight:600;font-size:13.5px;transition:background .18s,transform .18s;border:1px solid transparent;}
.sb-link:hover{background:rgba(255,255,255,0.09);transform:translateX(3px);}
.sb-link.active{background:rgba(255,255,255,0.16);border-color:rgba(255,255,255,0.13);color:white;}
.sb-link svg{width:17px;height:17px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;opacity:.88;}
.sb-link.active svg{opacity:1;}
.sb-bottom{padding:10px 10px 0;}
.sb-logout{display:flex;align-items:center;gap:11px;width:100%;padding:10px 13px;border-radius:10px;background:rgba(220,38,38,0.18);border:1px solid rgba(220,38,38,0.30);color:#fca5a5;font-weight:700;font-size:13.5px;cursor:pointer;text-decoration:none;transition:background .18s,transform .18s;}
.sb-logout:hover{background:rgba(220,38,38,0.30);transform:translateX(3px);}
.sb-logout svg{width:17px;height:17px;flex-shrink:0;fill:none;stroke:#fca5a5;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.sb-footer{padding:10px 18px 14px;font-size:11px;color:rgba(255,255,255,0.30);text-align:center;margin-top:8px;}
.main{margin-left:var(--sb-w);flex:1;padding:28px 26px 40px;min-height:100vh;}
.page-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.page-title{font-size:1.9rem;font-weight:800;color:#0a2f6e;text-shadow:0 0 14px rgba(255,255,255,0.98),0 2px 8px rgba(255,255,255,0.90);}
.header-badge{display:inline-flex;align-items:center;gap:7px;padding:6px 16px;border-radius:999px;background:rgba(255,255,255,0.82);border:1px solid rgba(255,255,255,0.95);font-size:13px;font-weight:700;color:#0a2f6e;box-shadow:0 2px 10px rgba(13,78,166,0.12);}
.stat-bar{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
.stat-pill{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.85);border:1px solid rgba(255,255,255,0.95);border-radius:14px;padding:14px 20px;box-shadow:0 3px 12px rgba(13,78,166,0.09);flex:1;min-width:160px;}
.stat-pill-icon{width:38px;height:38px;border-radius:10px;background:linear-gradient(135deg,#daeaff,#b8d4ff);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.stat-pill-icon svg{width:18px;height:18px;fill:none;stroke:#1a52b0;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.stat-num{font-size:1.9rem;font-weight:900;color:#16a34a;line-height:1;}
.stat-label{font-size:12px;font-weight:700;color:#4a6a96;}
.card{background:rgba(255,255,255,0.88);border:1px solid rgba(255,255,255,0.95);border-radius:18px;padding:24px;box-shadow:0 4px 22px rgba(13,78,166,0.09);}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
.card-title{font-size:1.05rem;font-weight:800;color:#0a2f6e;display:flex;align-items:center;gap:8px;}
.card-title svg{width:17px;height:17px;fill:none;stroke:#1a52b0;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;}
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead tr{background:#f0f5ff;}
th{padding:11px 14px;text-align:left;font-size:11.5px;font-weight:700;color:#1a52b0;letter-spacing:0.3px;text-transform:uppercase;border-bottom:2px solid #dbeafe;white-space:nowrap;}
td{padding:12px 14px;border-bottom:1px solid #f0f4f8;color:#1e3a5f;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(219,234,254,0.35);}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;}
.badge-blue{background:#dbeafe;color:#1d4ed8;}
.badge-green{background:#dcfce7;color:#15803d;}
.badge-amber{background:#fef3c7;color:#92400e;}
.badge-gray{background:#f1f5f9;color:#475569;}
.badge-red{background:#fee2e2;color:#b91c1c;}
.empty-td{text-align:center;padding:32px;color:#64748b;font-size:13px;}
</style>
</head>
<body>
<aside class="sidebar">
    <a th:href="@{/encadrant}" class="sb-brand">
        <img th:src="@{/images/logo.png}" alt="ENSAH" class="sb-logo">
        <div><div class="sb-title">Gestion PFE</div><div class="sb-sub">ENSAH &middot; Al Hoceima</div></div>
    </a>
    <nav class="sb-nav">
        <a th:href="@{/encadrant}" class="sb-link">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard
        </a>
        <a th:href="@{/encadrant/etudiants}" class="sb-link">
            <svg viewBox="0 0 24 24"><path d="M12 3L2 9l10 6 10-6-10-6z"/><path d="M6 11.5v4.5c0 0 2 2 6 2s6-2 6-2v-4.5"/></svg>Mes étudiants
        </a>
        <a th:href="@{/encadrant/soutenances}" class="sb-link active">
            <svg viewBox="0 0 24 24"><path d="M12 21s8-4 8-9.5V5.5l-8-3-8 3V11.5c0 5.5 8 9.5 8 9.5z"/></svg>Mes soutenances
        </a>
        <a th:href="@{/encadrant/planning}" class="sb-link">
            <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>Mon planning
        </a>
        <a th:href="@{/encadrant/repartition}" class="sb-link">
            <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>Ma répartition
        </a>
    </nav>
    <div class="sb-bottom">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="sb-logout">
                <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Déconnexion
            </button>
        </form>
    </div>
    <div class="sb-footer">&copy; 2026 ENSAH &middot; Gestion PFE</div>
</aside>

<main class="main">
    <div class="page-header">
        <h1 class="page-title">Mes soutenances</h1>
        <div class="header-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#0a2f6e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s8-4 8-9.5V5.5l-8-3-8 3V11.5c0 5.5 8 9.5 8 9.5z"/></svg>
            <span th:text="${teacher.prenom + ' ' + teacher.nom}">Encadrant</span>
        </div>
    </div>

    <div class="stat-bar">
        <div class="stat-pill">
            <div class="stat-pill-icon"><svg viewBox="0 0 24 24"><path d="M12 21s8-4 8-9.5V5.5l-8-3-8 3V11.5c0 5.5 8 9.5 8 9.5z"/></svg></div>
            <div><div class="stat-num" th:text="${defensesCount}">0</div><div class="stat-label">Total soutenances</div></div>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <div class="card-title">
                <svg viewBox="0 0 24 24"><path d="M12 21s8-4 8-9.5V5.5l-8-3-8 3V11.5c0 5.5 8 9.5 8 9.5z"/></svg>
                Liste des soutenances
            </div>
        </div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Étudiant</th>
                        <th>Date</th>
                        <th>Heure début</th>
                        <th>Heure fin</th>
                        <th>Salle</th>
                        <th>Langue</th>
                        <th>Rôle</th>
                        <th>Statut</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(defenses)}">
                        <td colspan="8" class="empty-td">Aucune soutenance trouvée.</td>
                    </tr>
                    <tr th:each="d : ${defenses}">
                        <td style="font-weight:600;" th:text="${d.student != null ? d.student.prenom + ' ' + d.student.nom : '-'}">—</td>
                        <td th:text="${d.dateSoutenance != null ? d.dateSoutenance : '-'}">—</td>
                        <td th:text="${d.heureDebut != null ? d.heureDebut : '-'}">—</td>
                        <td th:text="${d.heureFin != null ? d.heureFin : '-'}">—</td>
                        <td><span class="badge badge-gray" th:text="${d.room != null ? d.room.nomSalle : '-'}">—</span></td>
                        <td><span class="badge badge-blue" th:text="${d.langue != null ? d.langue : '-'}">—</span></td>
                        <td>
                            <span class="badge"
                                th:classappend="${d.encadrant != null and d.encadrant.id == teacher.id} ? ' badge-green' : ' badge-amber'"
                                th:text="${d.encadrant != null and d.encadrant.id == teacher.id ? 'Encadrant'
                                         : (d.jury1 != null and d.jury1.id == teacher.id ? 'Jury 1'
                                         : (d.jury2 != null and d.jury2.id == teacher.id ? 'Jury 2' : '-'))}">—</span>
                        </td>
                        <td>
                            <span class="badge"
                                th:classappend="${d.statut == 'PLANIFIEE'} ? ' badge-blue' : (${d.statut == 'VALIDEE'} ? ' badge-green' : ' badge-amber')"
                                th:text="${d.statut != null ? d.statut : '-'}">—</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
