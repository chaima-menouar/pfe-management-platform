<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des salles</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;}

        body{
            font-family:Arial,sans-serif;
            color:#0f172a;
            background:
                radial-gradient(circle at top left,rgba(59,130,246,.08),transparent 26%),
                linear-gradient(180deg,#eef4ff 0%,#f8fbff 24%,#f8fafc 100%);
            min-height:100vh;
        }

        .main-content{
            margin-left:260px;
            width:calc(100% - 260px);
            min-height:100vh;
            padding:28px 26px 40px;
        }

        .hero{
            position:relative;overflow:hidden;border-radius:24px;
            padding:30px 34px;color:white;margin-bottom:22px;
            background:
                linear-gradient(135deg,rgba(29,78,216,.96),rgba(30,64,175,.92) 48%,rgba(15,23,42,.96)),
                url('/images/ensah.png') no-repeat right 28px center / 170px auto;
            box-shadow:0 20px 44px rgba(15,23,42,.18);
        }
        .hero h1{margin:0 0 8px;font-size:clamp(1.6rem,3vw,2.2rem);}
        .hero p{margin:0;color:rgba(255,255,255,.88);line-height:1.7;max-width:680px;font-size:15px;}

        .actions-bar{
            display:flex;justify-content:flex-end;align-items:center;
            flex-wrap:wrap;gap:12px;margin-bottom:20px;
        }

        .btn{
            display:inline-flex;align-items:center;justify-content:center;gap:6px;
            text-decoration:none;border:none;cursor:pointer;
            padding:11px 18px;border-radius:13px;color:white;
            font-weight:700;font-size:13.5px;
            background:linear-gradient(135deg,#3b82f6,#2563eb);
            box-shadow:0 10px 22px rgba(37,99,235,.22);
            transition:transform .22s,box-shadow .22s,filter .22s;
        }
        .btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 16px 28px rgba(37,99,235,.28);filter:brightness(1.04);}

        .alert-success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0;padding:13px 16px;border-radius:12px;margin-bottom:14px;font-weight:700;}
        .alert-error{background:#fee2e2;color:#991b1b;border:1px solid #fecaca;padding:13px 16px;border-radius:12px;margin-bottom:14px;font-weight:700;}

        .table-card{
            background:rgba(255,255,255,.92);
            border:1px solid rgba(255,255,255,.80);
            border-radius:22px;
            box-shadow:0 16px 36px rgba(15,23,42,.08);
            overflow:hidden;
        }
        .table-wrap{width:100%;overflow-x:auto;}

        table{width:100%;border-collapse:collapse;}

        th,td{
            border-bottom:1px solid #e2e8f0;
            padding:13px 16px;text-align:left;
            vertical-align:middle;font-size:14px;
        }
        th{
            background:linear-gradient(135deg,#eaf2ff,#dbeafe);
            color:#0f172a;font-weight:800;
        }
        tbody tr{transition:background .15s;}
        tbody tr:hover{background:rgba(219,234,254,.25);}
        tbody tr:last-child td{border-bottom:none;}

        .badge-oui{display:inline-block;padding:3px 10px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:700;font-size:12px;}
        .badge-non{display:inline-block;padding:3px 10px;border-radius:999px;background:#f1f5f9;color:#64748b;font-weight:700;font-size:12px;}

        .action-link{font:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:none;font-weight:700;color:#1d4ed8;transition:color .15s;}
        .action-link:hover{color:#2563eb;}
        .action-link.delete{color:#dc2626;}
        .action-link.delete:hover{color:#b91c1c;}
        .sep{color:#cbd5e1;margin:0 4px;}

        @media(max-width:992px){.main-content{margin-left:0;width:100%;padding:18px 14px 28px;}}
    </style>
</head>
<body>

<div th:replace="fragments/navbar :: navbar('rooms')"></div>

<div class="main-content">

    <div class="hero">
        <h1>Liste des salles</h1>
        <p>G&#233;rez les salles disponibles, leurs capacit&#233;s et leur disponibilit&#233; pour les soutenances.</p>
    </div>

    <div class="actions-bar">
        <a class="btn" th:href="@{/rooms/new}">+ Ajouter une salle</a>
    </div>

    <div th:if="${success}" class="alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <div class="table-card">
        <div class="table-wrap">
            <table>
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Nom Salle</th>
                    <th>Capacit&#233;</th>
                    <th>Active</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="room : ${rooms}">
                    <td th:text="${room.id}"></td>
                    <td th:text="${room.nomSalle}"></td>
                    <td th:text="${room.capacite}"></td>
                    <td>
                        <span th:if="${room.active != null && room.active}" class="badge-oui">Oui</span>
                        <span th:if="${room.active == null || !room.active}" class="badge-non">Non</span>
                    </td>
                    <td>
                        <a class="action-link" th:href="@{/rooms/edit/{id}(id=${room.id})}">Modifier</a>
                        <span class="sep">|</span>
                        <form th:action="@{/rooms/delete/{id}(id=${room.id})}" method="post" style="display:inline"
                              onsubmit="return confirm('Voulez-vous vraiment supprimer cette salle ?');">
                            <button class="action-link delete" type="submit">Supprimer</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>
</body>
</html>
