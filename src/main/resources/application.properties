spring.application.name=gestionpfe

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gestion_pfe?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
server.port=${SERVER_PORT:8080}
server.error.include-message=never

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# Required only when the database does not yet contain an administrator.
app.bootstrap-admin.username=${APP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${APP_ADMIN_PASSWORD:}
app.bootstrap-rooms=${APP_BOOTSTRAP_ROOMS:true}
