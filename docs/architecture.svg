<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="340" viewBox="0 0 1180 340" role="img" aria-labelledby="title desc"><title id="title">PFE Management Platform architecture</title><desc id="desc">Thymeleaf user interfaces pass through Spring Security and Spring MVC controllers into business services, Spring Data JPA and MySQL, with Excel import and PDF/Excel export services.</desc><defs><style>.b{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:14}.t{font:600 18px Arial,sans-serif;fill:#0f172a}.s{font:14px Arial,sans-serif;fill:#475569}.a{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#64748b"/></marker></defs><rect class="b" x="25" y="125" width="170" height="90"/><text class="t" x="110" y="160" text-anchor="middle">Thymeleaf UI</text><text class="s" x="110" y="188" text-anchor="middle">admin / supervisor</text><rect class="b" x="245" y="125" width="170" height="90"/><text class="t" x="330" y="160" text-anchor="middle">Spring Security</text><text class="s" x="330" y="188" text-anchor="middle">roles + CSRF</text><rect class="b" x="465" y="125" width="170" height="90"/><text class="t" x="550" y="160" text-anchor="middle">Spring MVC</text><text class="s" x="550" y="188" text-anchor="middle">controllers</text><rect class="b" x="685" y="125" width="170" height="90"/><text class="t" x="770" y="160" text-anchor="middle">Services</text><text class="s" x="770" y="188" text-anchor="middle">planning + allocation</text><rect class="b" x="905" y="125" width="170" height="90"/><text class="t" x="990" y="160" text-anchor="middle">JPA / MySQL</text><text class="s" x="990" y="188" text-anchor="middle">persistent data</text><rect class="b" x="685" y="25" width="170" height="70"/><text class="t" x="770" y="57" text-anchor="middle">Excel Import</text><text class="s" x="770" y="81" text-anchor="middle">Apache POI</text><rect class="b" x="685" y=